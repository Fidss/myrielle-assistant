<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Myrielle AI — Direct API · File Upload</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: radial-gradient(circle at 10% 30%, #f9fafc 0%, #edf2f7 100%); min-height: 100vh; }
        .chat-container { max-height: calc(100vh - 200px); overflow-y: auto; }
        .user-bubble { background: #0f172a; color: white; border-radius: 28px; border-bottom-right-radius: 8px; }
        .bot-bubble { background: white; border-radius: 28px; border-bottom-left-radius: 8px; border: 1px solid #e2e8f0; }
        .typing-dots span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #94a3b8; margin: 0 2px; animation: typing 1.4s infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { transform: translateY(0); opacity: 0.5; } 30% { transform: translateY(-8px); opacity: 1; } }
        .markdown-content pre { background: #0d1117; border-radius: 12px; padding: 12px; overflow-x: auto; }
        .markdown-content code { font-family: 'JetBrains Mono', monospace; }
        .file-preview { background: #f1f5f9; border-radius: 20px; padding: 4px 12px; font-size: 12px; display: inline-flex; align-items: center; gap: 8px; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1f2937; color: white; padding: 10px 20px; border-radius: 40px; z-index: 1000; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    </style>
</head>
<body>
    <div class="max-w-3xl mx-auto px-4 py-4">
        <!-- Header -->
        <div class="flex items-center justify-between mb-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-gray-800 to-gray-900 rounded-2xl flex items-center justify-center">
                    <i class="fas fa-feather-alt text-white text-sm"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl">Myrielle</h1>
                    <p class="text-xs text-gray-500">Direct API · Pilih Model</p>
                </div>
            </div>
            <div class="flex gap-2">
                <select id="modelSelect" class="text-sm border rounded-full px-4 py-2 bg-white shadow-sm">
                    <option value="moonshotai/kimi-k2.6:free">🌙 Kimi K2.6</option>
                    <option value="openai/gpt-oss-20b:free">🤖 GPT-OSS 20B</option>
                    <option value="google/gemma-4-31b-it:free">🔵 Gemma 4 31B</option>
                    <option value="qwen/qwen3-next-80b-a3b-instruct:free">🐉 Qwen 3 Next 80B</option>
                    <option value="meta-llama/llama-3.3-70b-instruct:free">🦙 Llama 3.3 70B</option>
                </select>
                <button onclick="clearChat()" class="text-sm border rounded-full px-4 py-2 bg-white shadow-sm hover:bg-gray-50">
                    <i class="far fa-trash-alt"></i>
                </button>
            </div>
        </div>

        <!-- Chat Area -->
        <div id="chatArea" class="chat-container bg-white/40 rounded-2xl p-4 mb-4 space-y-4" style="height: calc(100vh - 200px); overflow-y: auto;">
            <div class="flex gap-3">
                <div class="w-8 h-8 bg-gradient-to-br from-gray-700 to-gray-800 rounded-xl flex items-center justify-center">
                    <i class="fas fa-sparkles text-white text-xs"></i>
                </div>
                <div class="flex-1">
                    <div class="bot-bubble px-4 py-3">
                        <p class="font-bold">Halo! Saya Myrielle ✨</p>
                        <p class="text-sm text-gray-600 mt-1">Saya bisa membantu coding, menjawab pertanyaan, dan menganalisis file yang diupload. Coba upload gambar atau dokumen!</p>
                        <div class="flex gap-2 mt-3 flex-wrap">
                            <button onclick="sendQuick('Buat kalkulator Python sederhana')" class="text-xs bg-gray-100 px-3 py-1 rounded-full">🐍 Kalkulator Python</button>
                            <button onclick="sendQuick('Buat fungsi sorting array JavaScript')" class="text-xs bg-gray-100 px-3 py-1 rounded-full">📜 Sorting JS</button>
                            <button onclick="sendQuick('Jelaskan async/await')" class="text-xs bg-gray-100 px-3 py-1 rounded-full">⚡ Async/Await</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="bg-white rounded-2xl shadow-lg p-3">
            <div id="filePreview" class="flex flex-wrap gap-2 mb-2"></div>
            <div class="flex gap-2">
                <textarea id="messageInput" rows="1" placeholder="Tanya apa saja... atau upload file (gambar, PDF, txt, kode)" 
                    class="flex-1 resize-none border-0 focus:ring-0 outline-none text-sm py-2 px-3" 
                    style="min-height: 44px; max-height: 100px;"
                    onkeydown="if(event.key=='Enter' && !event.shiftKey){event.preventDefault();sendMessage()}"></textarea>
                <label for="fileInput" class="cursor-pointer p-2 rounded-full hover:bg-gray-100">
                    <i class="fas fa-paperclip text-gray-500"></i>
                </label>
                <input type="file" id="fileInput" multiple accept=".jpg,.jpeg,.png,.gif,.pdf,.txt,.md,.py,.js,.html,.css,.json" style="display:none" onchange="handleFiles(this.files)">
                <button onclick="sendMessage()" id="sendBtn" class="bg-gray-900 text-white px-4 rounded-full hover:bg-gray-800">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
            <p class="text-xs text-gray-400 mt-2 text-center">
                <i class="fas fa-keyboard"></i> Enter kirim · <i class="fas fa-image ml-2"></i> Upload gambar/dokumen
            </p>
        </div>
    </div>

    <script>
        // Configuration
        const OPENROUTER_API_KEY = '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';
        
        let isProcessing = false;
        let attachedFiles = [];
        let currentAssistantMessage = null;

        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = `toast ${isError ? 'bg-red-600' : 'bg-gray-800'}`;
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatMarkdown(text) {
            try {
                marked.setOptions({
                    highlight: function(code, lang) {
                        if (lang && hljs.getLanguage(lang)) {
                            return hljs.highlight(code, { language: lang }).value;
                        }
                        return hljs.highlightAuto(code).value;
                    }
                });
                return DOMPurify.sanitize(marked.parse(text));
            } catch(e) {
                return escapeHtml(text);
            }
        }

        function addUserMessage(text, hasFiles = false) {
            const chatArea = document.getElementById('chatArea');
            const welcomeDiv = chatArea.querySelector('#welcomeMessage');
            if (welcomeDiv) welcomeDiv.remove();
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex gap-3 justify-end';
            let filesHtml = '';
            if (hasFiles && attachedFiles.length) {
                filesHtml = `<div class="text-xs text-gray-500 mt-1">📎 ${attachedFiles.length} file terlampir</div>`;
            }
            messageDiv.innerHTML = `
                <div class="flex-1 text-right max-w-[80%]">
                    <div class="user-bubble inline-block px-4 py-2 text-left">
                        <p class="text-sm">${escapeHtml(text || 'Mengirim file...')}</p>
                        ${filesHtml}
                    </div>
                </div>
                <div class="w-8 h-8 bg-gray-200 rounded-xl flex items-center justify-center">
                    <i class="fas fa-user text-gray-600 text-xs"></i>
                </div>
            `;
            chatArea.appendChild(messageDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            return messageDiv;
        }

        function showTypingIndicator() {
            const chatArea = document.getElementById('chatArea');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'flex gap-3';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="w-8 h-8 bg-gradient-to-br from-gray-700 to-gray-800 rounded-xl flex items-center justify-center">
                    <i class="fas fa-feather-alt text-white text-xs"></i>
                </div>
                <div class="flex-1">
                    <div class="bot-bubble px-4 py-3">
                        <div class="typing-dots">
                            <span></span><span></span><span></span>
                            <span class="text-xs text-gray-500 ml-2">Myrielle sedang mengetik...</span>
                        </div>
                    </div>
                </div>
            `;
            chatArea.appendChild(typingDiv);
            chatArea.scrollTop = chatArea.scrollHeight;
            return typingDiv;
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) indicator.remove();
        }

        function addBotMessage(content) {
            const chatArea = document.getElementById('chatArea');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex gap-3';
            const formattedContent = formatMarkdown(content);
            messageDiv.innerHTML = `
                <div class="w-8 h-8 bg-gradient-to-br from-gray-700 to-gray-800 rounded-xl flex items-center justify-center">
                    <i class="fas fa-feather-alt text-white text-xs"></i>
                </div>
                <div class="flex-1 max-w-[80%]">
                    <div class="bot-bubble px-4 py-3">
                        <div class="markdown-content text-sm">${formattedContent}</div>
                    </div>
                </div>
            `;
            chatArea.appendChild(messageDiv);
            messageDiv.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
            chatArea.scrollTop = chatArea.scrollHeight;
            return messageDiv;
        }

        async function handleFiles(files) {
            for (let file of files) {
                const isImage = file.type.startsWith('image/');
                const isText = file.type === 'text/plain' || /\.(txt|md|py|js|html|css|json)$/i.test(file.name);
                
                let content = null;
                if (isImage) {
                    const reader = new FileReader();
                    content = await new Promise((resolve) => {
                        reader.onload = (e) => resolve(e.target.result);
                        reader.readAsDataURL(file);
                    });
                    attachedFiles.push({ name: file.name, type: 'image', content: content });
                } else if (isText) {
                    const text = await file.text();
                    attachedFiles.push({ name: file.name, type: 'text', content: text });
                } else {
                    attachedFiles.push({ name: file.name, type: 'other', content: file.name });
                }
                
                // Show preview
                const preview = document.getElementById('filePreview');
                const chip = document.createElement('div');
                chip.className = 'file-preview';
                chip.innerHTML = `<i class="fas ${isImage ? 'fa-image' : 'fa-file'} text-gray-500"></i> ${file.name} <i class="fas fa-times-circle text-gray-400 cursor-pointer" onclick="this.parentElement.remove(); removeFile('${file.name}')"></i>`;
                preview.appendChild(chip);
            }
            showToast(`${files.length} file siap dikirim`);
        }

        function removeFile(filename) {
            attachedFiles = attachedFiles.filter(f => f.name !== filename);
        }

        function clearAllFiles() {
            attachedFiles = [];
            document.getElementById('filePreview').innerHTML = '';
        }

        async function sendMessage() {
            if (isProcessing) return;
            
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            if (!message && attachedFiles.length === 0) return;
            
            isProcessing = true;
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            addUserMessage(message || '📎 Mengirim file', attachedFiles.length > 0);
            const typingIndicator = showTypingIndicator();
            
            // Build context with files
            let finalMessage = message;
            if (attachedFiles.length > 0) {
                let fileContext = '\n\n--- File yang diupload ---\n';
                for (let file of attachedFiles) {
                    if (file.type === 'text') {
                        fileContext += `File ${file.name}:\n${file.content.substring(0, 3000)}\n\n`;
                    } else if (file.type === 'image') {
                        fileContext += `[Gambar: ${file.name}] - Analisis berdasarkan nama file dan konteks\n`;
                    } else {
                        fileContext += `[File: ${file.name}] - Tipe: ${file.type}\n`;
                    }
                }
                finalMessage = message ? message + fileContext : `Analisis file berikut:\n${fileContext}`;
            }
            
            const selectedModel = document.getElementById('modelSelect').value;
            const modelName = document.getElementById('modelSelect').options[document.getElementById('modelSelect').selectedIndex].text;
            
            try {
                const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${OPENROUTER_API_KEY}`,
                        'Content-Type': 'application/json',
                        'HTTP-Referer': 'https://myrielle.local',
                        'X-Title': 'Myrielle Assistant'
                    },
                    body: JSON.stringify({
                        model: selectedModel,
                        messages: [
                            {
                                role: 'system',
                                content: 'Anda adalah Myrielle, asisten AI yang membantu, ramah, dan profesional. Berikan respons yang jelas, akurat, dan membantu. Untuk kode program, gunakan format markdown dengan sintaks highlighting.'
                            },
                            {
                                role: 'user',
                                content: finalMessage
                            }
                        ],
                        temperature: 0.7,
                        max_tokens: 2000
                    })
                });
                
                if (!response.ok) {
                    let errorMsg = `HTTP ${response.status}`;
                    if (response.status === 429) {
                        errorMsg = 'Rate limit tercapai. Tunggu beberapa saat atau ganti model.';
                    } else if (response.status === 401) {
                        errorMsg = 'API Key tidak valid. Periksa konfigurasi.';
                    }
                    throw new Error(errorMsg);
                }
                
                const data = await response.json();
                const aiResponse = data.choices[0].message.content;
                
                removeTypingIndicator();
                addBotMessage(aiResponse);
                clearAllFiles();
                
            } catch (error) {
                removeTypingIndicator();
                addBotMessage(`❌ **Error:** ${error.message}\n\nCoba ganti model atau tunggu beberapa saat.`);
                showToast(error.message, true);
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                document.getElementById('messageInput').value = '';
                document.getElementById('messageInput').style.height = 'auto';
                document.getElementById('messageInput').focus();
            }
        }

        function sendQuick(message) {
            document.getElementById('messageInput').value = message;
            sendMessage();
        }

        function clearChat() {
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = `
                <div class="flex gap-3" id="welcomeMessage">
                    <div class="w-8 h-8 bg-gradient-to-br from-gray-700 to-gray-800 rounded-xl flex items-center justify-center">
                        <i class="fas fa-sparkles text-white text-xs"></i>
                    </div>
                    <div class="flex-1">
                        <div class="bot-bubble px-4 py-3">
                            <p class="font-bold">Chat baru dimulai! ✨</p>
                            <p class="text-sm text-gray-600 mt-1">Pilih model AI dan mulai bertanya. Upload file untuk analisis!</p>
                        </div>
                    </div>
                </div>
            `;
            clearAllFiles();
        }

        // Auto-resize textarea
        const textarea = document.getElementById('messageInput');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 100) + 'px';
        });
        
        textarea.focus();
    </script>
</body>
</html>
