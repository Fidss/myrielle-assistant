<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myrielle Assistant - AI Chatbot</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        * {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }
        
        .message-animate {
            animation: fadeIn 0.3s ease-out;
        }
        
        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: #9ca3af;
            border-radius: 50%;
            display: inline-block;
            animation: typingBounce 1.4s infinite;
        }
        
        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
        
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        
        .custom-scroll::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        pre {
            background-color: #f8fafc;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }
        
        code {
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        
        .markdown-content p {
            margin-bottom: 12px;
            line-height: 1.6;
        }
        
        .markdown-content ul, .markdown-content ol {
            margin: 8px 0;
            padding-left: 24px;
        }
        
        .markdown-content li {
            margin: 4px 0;
        }
    </style>
</head>
<body class="bg-white">
    
    <div class="flex flex-col h-screen">
        
        <!-- Header - Simple like ChatGPT -->
        <header class="border-b border-gray-200 bg-white/95 backdrop-blur-sm sticky top-0 z-10">
            <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-gray-900 rounded-full flex items-center justify-center">
                        <i class="fas fa-robot text-white text-sm"></i>
                    </div>
                    <div>
                        <h1 class="font-semibold text-gray-900">Myrielle Assistant</h1>
                        <p class="text-xs text-gray-500">Powered by OpenRouter AI</p>
                    </div>
                </div>
                <button onclick="clearChat()" class="text-gray-500 hover:text-gray-700 transition text-sm px-3 py-1 rounded-md hover:bg-gray-100">
                    <i class="fas fa-trash-alt mr-1"></i> New chat
                </button>
            </div>
        </header>
        
        <!-- Main Chat Area -->
        <div class="flex-1 overflow-hidden">
            <div id="chatMessages" class="h-full overflow-y-auto custom-scroll">
                <div class="max-w-3xl mx-auto px-4 py-6 space-y-6">
                    
                    <!-- Welcome Message -->
                    <div class="flex gap-4 message-animate" id="welcomeMessage">
                        <div class="w-8 h-8 bg-gray-900 rounded-full flex items-center justify-center flex-shrink-0">
                            <i class="fas fa-robot text-white text-xs"></i>
                        </div>
                        <div class="flex-1">
                            <div class="text-gray-800 leading-relaxed">
                                <p>Halo! Saya <strong>Myrielle</strong>, asisten AI Anda. Ada yang bisa saya bantu hari ini?</p>
                            </div>
                            <div class="mt-2 flex gap-2 flex-wrap">
                                <button onclick="sendQuickMessage('Apa itu Myrielle?')" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg transition">
                                    Apa itu Myrielle?
                                </button>
                                <button onclick="sendQuickMessage('Bantu saya menulis email')" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg transition">
                                    Bantu menulis email
                                </button>
                                <button onclick="sendQuickMessage('Jelaskan AI dengan analogi')" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg transition">
                                    Jelaskan AI
                                </button>
                            </div>
                        </div>
                    </div>
                    
                </div>
            </div>
        </div>
        
        <!-- Typing Indicator -->
        <div id="typingIndicator" class="hidden fixed bottom-24 left-0 right-0">
            <div class="max-w-3xl mx-auto px-4">
                <div class="flex gap-4 items-center">
                    <div class="w-8 h-8 bg-gray-900 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-robot text-white text-xs"></i>
                    </div>
                    <div class="bg-gray-100 rounded-full px-4 py-2">
                        <div class="flex gap-1">
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                            <span class="typing-dot"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Input Area - Like ChatGPT -->
        <div class="border-t border-gray-200 bg-white/95 backdrop-blur-sm">
            <div class="max-w-3xl mx-auto px-4 py-4">
                <div class="relative">
                    <textarea id="userInput" rows="1" 
                        placeholder="Kirim pesan ke Myrielle..."
                        class="w-full resize-none rounded-xl border border-gray-300 focus:border-gray-400 focus:ring-1 focus:ring-gray-400 outline-none py-3 pl-4 pr-12 text-gray-900 placeholder-gray-400 transition"
                        style="min-height: 52px; max-height: 200px;"
                        onkeydown="handleKeyDown(event)"
                    ></textarea>
                    <button onclick="sendMessage()" id="sendBtn"
                        class="absolute right-2 bottom-2 text-gray-500 hover:text-gray-700 transition p-2 rounded-lg hover:bg-gray-100">
                        <i class="fas fa-paper-plane text-lg"></i>
                    </button>
                </div>
                <p class="text-xs text-gray-400 text-center mt-3">
                    Myrielle Assistant dapat membuat kesalahan. Periksa informasi penting.
                </p>
            </div>
        </div>
    </div>
    
    <script>
        let isProcessing = false;
        let conversationHistory = [];
        
        // Auto-resize textarea
        const textarea = document.getElementById('userInput');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });
        
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                if (!isProcessing) {
                    sendMessage();
                }
            }
        }
        
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message || isProcessing) return;
            
            isProcessing = true;
            input.value = '';
            input.style.height = 'auto';
            
            // Disable send button
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            sendBtn.style.opacity = '0.5';
            
            // Add user message
            addUserMessage(message);
            
            // Scroll to bottom
            scrollToBottom();
            
            // Show typing indicator
            showTypingIndicator();
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message: message })
                });
                
                const data = await response.json();
                
                // Hide typing indicator
                hideTypingIndicator();
                
                if (data.success) {
                    addBotMessage(data.response);
                } else {
                    addBotMessage('Maaf, terjadi kesalahan. Silakan coba lagi nanti.');
                }
            } catch (error) {
                hideTypingIndicator();
                addBotMessage('Network error. Silakan periksa koneksi internet Anda.');
                console.error('Error:', error);
            } finally {
                isProcessing = false;
                sendBtn.disabled = false;
                sendBtn.style.opacity = '1';
                scrollToBottom();
            }
        }
        
        function addUserMessage(message) {
            const chatContainer = document.getElementById('chatMessages');
            const messagesDiv = chatContainer.querySelector('.space-y-6');
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex gap-4 justify-end message-animate';
            messageDiv.innerHTML = `
                <div class="flex-1 text-right">
                    <div class="inline-block bg-gray-100 rounded-2xl rounded-tr-sm px-4 py-2 max-w-[85%] text-left">
                        <p class="text-gray-800">${escapeHtml(message)}</p>
                    </div>
                    <div class="text-xs text-gray-400 mt-1">${getTime()}</div>
                </div>
                <div class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-user text-gray-600 text-xs"></i>
                </div>
            `;
            
            messagesDiv.appendChild(messageDiv);
            
            // Auto scroll to bottom
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 100);
        }
        
        function addBotMessage(message) {
            const chatContainer = document.getElementById('chatMessages');
            const messagesDiv = chatContainer.querySelector('.space-y-6');
            
            // Remove welcome message if it's still there and there are more than 1 message
            const welcomeMsg = document.getElementById('welcomeMessage');
            if (welcomeMsg && messagesDiv.children.length > 1) {
                welcomeMsg.remove();
            }
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex gap-4 message-animate';
            messageDiv.innerHTML = `
                <div class="w-8 h-8 bg-gray-900 rounded-full flex items-center justify-center flex-shrink-0">
                    <i class="fas fa-robot text-white text-xs"></i>
                </div>
                <div class="flex-1">
                    <div class="text-gray-800 leading-relaxed markdown-content">
                        ${formatMessage(message)}
                    </div>
                    <div class="text-xs text-gray-400 mt-1">${getTime()}</div>
                </div>
            `;
            
            messagesDiv.appendChild(messageDiv);
            
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 100);
        }
        
        function showTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            indicator.classList.remove('hidden');
            scrollToBottom();
        }
        
        function hideTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            indicator.classList.add('hidden');
        }
        
        function scrollToBottom() {
            const chatContainer = document.getElementById('chatMessages');
            setTimeout(() => {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }, 100);
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function formatMessage(text) {
            // Convert markdown-like syntax
            let formatted = text
                // Bold
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                // Italic
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                // Code blocks
                .replace(/```(.*?)```/gs, '<pre><code>$1</code></pre>')
                // Inline code
                .replace(/`(.*?)`/g, '<code class="bg-gray-100 px-1 py-0.5 rounded text-sm">$1</code>')
                // Line breaks
                .replace(/\n/g, '<br>');
            
            return formatted;
        }
        
        function getTime() {
            const now = new Date();
            return now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        }
        
        function sendQuickMessage(message) {
            if (!isProcessing) {
                document.getElementById('userInput').value = message;
                sendMessage();
            }
        }
        
        function clearChat() {
            const chatContainer = document.getElementById('chatMessages');
            const messagesDiv = chatContainer.querySelector('.space-y-6');
            
            // Clear all messages
            messagesDiv.innerHTML = `
                <!-- Welcome Message -->
                <div class="flex gap-4 message-animate" id="welcomeMessage">
                    <div class="w-8 h-8 bg-gray-900 rounded-full flex items-center justify-center flex-shrink-0">
                        <i class="fas fa-robot text-white text-xs"></i>
                    </div>
                    <div class="flex-1">
                        <div class="text-gray-800 leading-relaxed">
                            <p>Chat telah dibersihkan! Ada yang bisa saya bantu?</p>
                        </div>
                        <div class="mt-2 flex gap-2 flex-wrap">
                            <button onclick="sendQuickMessage('Apa itu Myrielle?')" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg transition">
                                Apa itu Myrielle?
                            </button>
                            <button onclick="sendQuickMessage('Bantu saya menulis email')" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg transition">
                                Bantu menulis email
                            </button>
                            <button onclick="sendQuickMessage('Jelaskan AI dengan analogi')" class="text-xs bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg transition">
                                Jelaskan AI
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Focus on input on page load
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('userInput').focus();
        });
    </script>
</body>
</html>
